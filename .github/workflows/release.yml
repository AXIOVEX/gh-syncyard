name: release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go test ./...
      # The release tag must equal the binary's own reported
      # version (v<version>); a mistagged release must not
      # ship a binary that reports a different version.
      - name: Assert tag matches binary version
        run: |
          go build -o /tmp/gh-syncyard .
          reported="$(/tmp/gh-syncyard version | awk '{print $2}')"
          echo "tag=${GITHUB_REF_NAME} binary=${reported}"
          test "${GITHUB_REF_NAME}" = "v${reported}"
      - uses: cli/gh-extension-precompile@v2
        with:
          go_version: "1.22"
